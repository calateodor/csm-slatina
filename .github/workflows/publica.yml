# Publicarea site-ului pe hostingul csmslatina.ro.
#
# Deocamdată conține DOAR proba în gol: se conectează prin FTPS, listează
# folderele de pe server și nu scrie absolut nimic. Job-urile de publicare
# propriu-zisă (test / live) se adaugă abia după ce proba confirmă
# conexiunea și structura folderelor.
#
# Rulează numai la push pe ramura `proba` sau pornit de mână. Niciun
# declanșator pe `main` — nimic nu se poate publica din greșeală.
name: Publica

on:
  push:
    branches: [proba]
  workflow_dispatch:

jobs:
  proba-in-gol:
    name: Proba in gol (doar citire)
    runs-on: ubuntu-latest
    steps:
      - name: Listeaza radacina contului FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          set +e
          if [ -z "$FTP_SERVER" ] || [ -z "$FTP_USER" ] || [ -z "$FTP_PASS" ]; then
            echo "::error::Unul dintre secrete lipseste. Verifica numele: FTP_SERVER, FTP_USER, FTP_PASS."
            [ -z "$FTP_SERVER" ] && echo "  FTP_SERVER: LIPSA"
            [ -z "$FTP_USER" ]   && echo "  FTP_USER:   LIPSA"
            [ -z "$FTP_PASS" ]   && echo "  FTP_PASS:   LIPSA"
            exit 1
          fi
          echo "Secretele sunt prezente. Ma conectez prin FTPS (explicit, port 21)..."
          echo "=================== RADACINA (/) ==================="
          curl -sS --ssl-reqd --connect-timeout 30 -u "$FTP_USER:$FTP_PASS" "ftp://$FTP_SERVER:21/"
          cod=$?
          if [ $cod -ne 0 ]; then
            echo "::error::Conexiunea FTPS a esuat (cod curl $cod)."
            echo "Incerc si fara verificarea certificatului, doar ca sa stim daca asta e cauza:"
            curl -sS --ssl-reqd --insecure --connect-timeout 30 -u "$FTP_USER:$FTP_PASS" "ftp://$FTP_SERVER:21/" && echo "(a mers fara verificare -> certificatul serverului nu e valid pentru $FTP_SERVER)"
            exit 1
          fi
          for d in public_html www httpdocs htdocs csmslatina.ro domains; do
            echo ""
            echo "=================== /$d/ ==================="
            curl -sS --ssl-reqd --connect-timeout 30 -u "$FTP_USER:$FTP_PASS" "ftp://$FTP_SERVER:21/$d/" 2>/dev/null || echo "(nu exista sau nu e accesibil)"
          done
          echo ""
          echo "Gata. Nu s-a scris nimic pe server."
